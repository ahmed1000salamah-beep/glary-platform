    <!-- Dynamic PWA Scoped Setup & Service Worker Registration -->
    <script>
      (function() {
        var path = window.location.pathname;
        var manifestLink = document.getElementById('app-manifest-link');
        var themeMeta = document.getElementById('meta-theme-color');
        var appleTitle = document.getElementById('apple-app-title');
        var favicon = document.getElementById('app-favicon');
        var appleIcon = document.getElementById('app-apple-icon');

        // Check if custom app icon was uploaded by teacher
        try {
          var customIcon = localStorage.getItem('glary_platform_app_icon_v1');
          if (customIcon) {
            if (favicon) favicon.href = customIcon;
            if (appleIcon) appleIcon.href = customIcon;
          }
        } catch (e) {}

        var targetManifest = '/manifest-student.json';
        var targetSW = '/sw-student.js';
        var targetScope = '/';
        var themeColor = '#1d4ed8';
        var titleName = 'منصة جلري';

        if (path.indexOf('/teacher') === 0) {
          targetManifest = '/manifest-teacher.json';
          targetSW = '/sw-teacher.js';
          targetScope = '/teacher';
          themeColor = '#d97706';
          titleName = 'المعلم - جلري';
        } else if (path.indexOf('/secretary') === 0) {
          targetManifest = '/manifest-secretary.json';
          targetSW = '/sw-secretary.js';
          targetScope = '/secretary';
          themeColor = '#6366f1';
          titleName = 'السكرتارية - جلري';
        }

        if (manifestLink) manifestLink.href = targetManifest;
        if (themeMeta) themeMeta.content = themeColor;
        if (appleTitle) appleTitle.content = titleName;

        // Register the respective Service Worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register(targetSW, { scope: targetScope })
            .then(function(reg) {
              reg.update();
              console.log('Glary PWA SW registered for scope:', targetScope);
            })
            .catch(function(err) {
              console.warn('SW registration info:', err);
            });
        }
      })();
    </script>
